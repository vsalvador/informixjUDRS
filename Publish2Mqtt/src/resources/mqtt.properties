# mqtt.properties

# MQTT broker connection URL. 
# Examples: 
# tcp://localhost:1883 - Local MQTT broker (unencrypted)
# tcp://broker.emqx.io:1883 - Public EMQX broker (unencrypted) 
# ssl://broker.emqx.io:8883 - Public EMQX broker (SSL/TLS encrypted)
brokerUrl=tcp://localhost:1883

# Alternative broker URLs:
#brokerUrl=tcp://broker.emqx.io:1883

# Unique MQTT client identifier.
#
# If not specified, the application automatically uses the local
# machine hostname as the clientId.
#
# Note: MQTT brokers require client IDs to be unique among all
# connected clients. If multiple instances run on the same host,
# configure an explicit clientId for each instance.
#
# Example:
# clientId=publish_client
#
# Default:
# <hostname>
clientId=publish_client

# Optional authentication credentials.
# Required only if the broker enforces authentication.
#username=emqx
#password=public

# MQTT topic to publish messages to.
# Topic names are hierarchical and use '/' as a separator.
#
# Example dynamic topic pattern:
# my/test/topic/%tabname/%database
# where:
#   %tabname & %database are extracted from message in JSON format
#
# Example final topic:
# my/test/topic/customerdb/orders
topic=informix

# MQTT Quality of Service (QoS) level.
#
# 0 = At most once
#     Fastest delivery, no delivery guarantee.
#
# 1 = At least once
#     Message is guaranteed to arrive, but duplicates are possible.
#
# 2 = Exactly once
#     Highest reliability, message delivered exactly once.
#     Highest protocol overhead.
#
# Recommended:
#   0 for telemetry/logging
#   1 for business events
#   2 for critical transactions
qosLevel=0

